<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="./src/main.ts"></script>
    <title>Assignment 2</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="screen" width="512" height="512"></canvas>

    <!-- TODO: Clean up this ui code -->
    <form class="menu" id="menu">
      <div class="group">
        <p>
          <label for="ct">Camera: </label>
          <input id="ct" type="checkbox">
        </p>
      </div>
      <div class="group">
        <p>
          <label for="cx">Camera <i>x</i>-position</label>
          <input
            id="cx"
            type="range"
            min="-100"
            max="100"
            step="1"
            value="0.0"
          />
          <span aria-hidden="true">0.00</span>
        </p>
        <p>
          <label for="cy">Camera <i>y</i>-position</label>
          <input
            id="cy"
            type="range"
            min="-100"
            max="100"
            step="1"
            value="0.0"
          />
          <span aria-hidden="true">0.00</span>
        </p>
        <p>
          <label for="cz">Camera <i>z</i>-position</label>
          <input
            id="cz"
            type="range"
            min="-100"
            max="100"
            step="1"
            value="0.0"
          />
          <span aria-hidden="true">0.00</span>
        </p>
      </div>
      <div class="group">
        <p>
          <label for="cRotx">Camera <i>x</i>-rotation</label>
          <input
            id="cRotx"
            type="range"
            min="-180"
            max="180"
            step="1"
            value="0.0"
          />
          <span aria-hidden="true">0.00</span>
        </p>
        <p>
          <label for="cRoty">Camera <i>y</i>-rotation</label>
          <input
            id="cRoty"
            type="range"
            min="-180"
            max="180"
            step="1"
            value="0.0"
          />
          <span aria-hidden="true">0.00</span>
        </p>
        <p>
          <label for="cRotz">Camera <i>z</i>-rotation</label>
          <input
            id="cRotz"
            type="range"
            min="-180"
            max="180"
            step="1"
            value="0.0"
          />
          <span aria-hidden="true">0.00</span>
        </p>
      </div>
    </form>
  </body>
</html>
